<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ledger">
<meta name="theme-color" content="#F5F4EE">
<title>Ledger — Monthly Expenses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F4EE;
    --paper-raised:#FCFBF7;
    --ink:#1C2B24;
    --ink-soft:#5B6B62;
    --line:#CFC8B4;
    --teal:#2F6F5E;
    --teal-deep:#1E4A3E;
    --brick:#A8442E;
    --gold:#C98A2C;
    --radius:10px;
    --shadow: 0 1px 2px rgba(28,43,36,0.06), 0 4px 14px rgba(28,43,36,0.06);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
    position:relative;
  }
  .num{ font-family:'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }

  /* ---------- Topbar ---------- */
  .topbar{
    position:sticky; top:0; z-index:20;
    background:var(--paper);
    padding:18px 18px 10px;
    border-bottom:1px solid var(--line);
  }
  .topbar-row{ display:flex; align-items:flex-start; justify-content:space-between; }
  .brand{ position:relative; }
  .board-switcher{
    display:flex; align-items:center; gap:5px; background:none; border:none; padding:0; margin:0; cursor:pointer; color:var(--ink);
  }
  .board-switcher:active{ opacity:0.75; }
  .board-name{
    font-family:'DM Serif Display', serif;
    font-size:26px; letter-spacing:0.2px; line-height:1;
    max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .board-chevron{ color:var(--ink-soft); transition: transform .2s ease; flex-shrink:0; margin-top:3px; }
  .board-chevron.open{ transform: rotate(180deg); }
  .brand .month{
    font-size:12px; color:var(--ink-soft); margin-top:2px; letter-spacing:0.06em; text-transform:uppercase;
  }
  .icon-btn{
    width:36px; height:36px; border-radius:8px; border:1px solid var(--line);
    background:var(--paper-raised); display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--ink); transition: background .15s ease, transform .1s ease;
  }
  .icon-btn:active{ transform: scale(0.94); background:#EFEBDD; }
  .icon-btn.ghost{ border:none; background:transparent; width:28px; height:28px; }
  .icon-btn.tiny{ width:24px; height:24px; }
  .topbar-actions{ display:flex; gap:8px; }

  /* ---------- Board dropdown ---------- */
  .board-menu{
    position:absolute; top:100%; left:0; margin-top:8px;
    background:var(--paper-raised); border:1px solid var(--line); border-radius:10px;
    box-shadow:var(--shadow); min-width:230px; padding:8px; display:none; z-index:30;
  }
  .board-menu.open{ display:block; }
  .board-menu-item{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:10px 10px; border-radius:6px; cursor:pointer; font-size:14px;
  }
  .board-menu-item.active{ background:#EFEBDD; font-weight:600; }
  .board-menu-item .dot{ width:7px; height:7px; border-radius:50%; background:var(--teal); opacity:0; flex-shrink:0; }
  .board-menu-item.active .dot{ opacity:1; }
  .board-menu-item .bname{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .board-menu-add{
    width:100%; margin-top:6px; padding:10px; border-radius:6px; border:1px dashed var(--line);
    background:none; color:var(--teal-deep); font-weight:600; font-size:13px; cursor:pointer;
  }
  .board-menu-add:disabled{ opacity:0.4; cursor:not-allowed; }
  .board-menu-hint{ font-size:11px; color:var(--ink-soft); margin:8px 2px 2px; text-align:center; }

  /* ---------- Views ---------- */
  main.view{ padding:16px 18px 100px; flex:1; }
  main.view.hidden{ display:none; }

  /* ---------- Hero / receipt header ---------- */
  .hero{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px 18px 16px;
    box-shadow:var(--shadow);
    margin-top:16px;
    text-align:center;
  }
  .hero-title{
    font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:4px; text-align:left;
  }
  .hero-remaining-label{
    font-size:12px; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-soft); margin-top:10px;
  }
  .hero-remaining-value{
    font-family:'DM Serif Display', serif; font-size:42px; line-height:1.15; margin:2px 0 4px;
  }
  .hero-remaining-value.warn{ color:var(--brick); }
  .hero-remaining-value.good{ color:var(--teal-deep); }
  .hero-caption{ font-size:12.5px; color:var(--ink-soft); }
  .hero-caption .num{ color:var(--ink); font-weight:500; }

  .bar-track{
    position:relative; height:10px; border-radius:3px; background:#E9E4D2; overflow:hidden; margin-top:14px;
    background-image: repeating-linear-gradient(90deg, transparent, transparent calc(10% - 1px), rgba(28,43,36,0.14) calc(10% - 1px), rgba(28,43,36,0.14) 10%);
  }
  .bar-fill{ position:absolute; left:0; top:0; bottom:0; background:var(--teal); border-radius:3px; transition: width .35s ease; }
  .bar-fill.over{ background:var(--brick); }

  /* ---------- Category cards (overview) ---------- */
  .section-label{
    font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-soft);
    margin:22px 2px 8px;
  }
  .subsection-label{
    font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-soft);
    margin:14px 0 2px;
  }
  .cat-card{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius);
    margin-bottom:12px; box-shadow:var(--shadow); overflow:hidden;
  }
  .cat-head{
    display:flex; align-items:center; justify-content:space-between; padding:14px 16px; cursor:pointer;
  }
  .cat-head-left{ flex:1; min-width:0; }
  .cat-name{ font-size:15px; font-weight:600; }
  .cat-sub{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .cat-amounts{ text-align:right; }
  .cat-amounts .remaining{ font-size:15px; font-weight:600; }
  .cat-amounts .of{ font-size:11px; color:var(--ink-soft); margin-top:2px; }
  .chev{ margin-left:10px; color:var(--ink-soft); transition: transform .2s ease; flex-shrink:0; }
  .chev.open{ transform: rotate(180deg); }
  .cat-bar-wrap{ padding:0 16px 14px; }
  .cat-items{ border-top:1px dashed var(--line); padding:2px 16px 14px; display:none; }
  .cat-items.open{ display:block; }

  .plan-row{
    display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px dashed var(--line); cursor:pointer;
  }
  .plan-row:first-child{ border-top:none; }
  .check{
    width:19px; height:19px; border-radius:50%; border:1.6px solid var(--line);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; color:#fff;
    transition: background .15s ease, border-color .15s ease;
  }
  .check.checked{ background:var(--teal); border-color:var(--teal-deep); }
  .plan-row .label{ font-size:13.5px; }
  .plan-row.paid .label{ color:var(--ink-soft); text-decoration:line-through; }
  .plan-row.paid .amount{ color:var(--ink-soft); }
  .plan-row .amount{ font-size:13.5px; font-weight:500; }

  .log-row{ display:flex; align-items:center; gap:6px; padding:7px 0; border-top:1px dashed var(--line); font-size:13px; }
  .log-row:first-child{ border-top:none; }
  .log-row .label{ color:var(--ink); }
  .log-row .amount{ font-size:13px; font-weight:500; }

  .empty-items{ font-size:12px; color:var(--ink-soft); padding:6px 0 2px; font-style:italic; }

  .quick-add-row{ display:flex; gap:6px; align-items:center; margin-top:10px; }
  .quick-add-row input[type=text]{ flex:1.4; }
  .quick-add-row input[type=number]{ flex:1; }
  .quick-add-row .icon-btn{ width:36px; height:36px; flex-shrink:0; background:var(--teal); color:#fff; border-color:var(--teal-deep); }

  .empty-state{ text-align:center; padding:50px 20px; color:var(--ink-soft); }
  .empty-state h3{ font-family:'DM Serif Display', serif; color:var(--ink); font-size:20px; margin-bottom:6px; font-weight:normal;}
  .empty-state p{ font-size:13px; line-height:1.5; }
  .empty-state button{ margin-top:16px; }

  /* ---------- Forms / Edit view ---------- */
  .field-group{ margin-bottom:10px; }
  label.flabel{ display:block; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:5px; }
  .override-tag{ color:var(--gold); font-weight:700; letter-spacing:0.04em; }
  input[type=text], input[type=number]{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px;
    background:#fff; font-family:'IBM Plex Mono', monospace; font-size:15px; color:var(--ink);
  }
  input[type=text]{ font-family:'Inter', sans-serif; font-size:14px; }
  input:focus{ outline:2px solid var(--teal); outline-offset:1px; border-color:var(--teal); }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:10px 16px; border-radius:8px; border:1px solid var(--teal-deep);
    background:var(--teal); color:#fff; font-weight:600; font-size:13.5px;
    cursor:pointer; transition: transform .1s ease, background .15s ease;
  }
  .btn:active{ transform: scale(0.97); }
  .btn.secondary{ background:transparent; color:var(--teal-deep); }
  .btn.danger{ background:transparent; color:var(--brick); border-color:var(--brick); }
  .btn.small{ padding:7px 12px; font-size:12.5px; }
  .btn.block{ width:100%; }
  .btn.saved{ background:var(--teal-deep); }

  .row-inline{ display:flex; gap:8px; align-items:flex-end; }
  .row-inline > div{ flex:1; }

  .edit-card{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; margin-bottom:14px; box-shadow:var(--shadow);
  }
  .edit-card-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .edit-card-head .cat-name{ font-size:16px; }

  .items-list{ margin-top:14px; }
  .item-edit-row{ display:flex; gap:6px; align-items:center; padding:8px 0; border-top:1px dashed var(--line); }
  .item-edit-row input[type=text]{ flex:1.4; }
  .item-edit-row input[type=number]{ flex:1; }
  .item-edit-row .icon-btn{ width:32px; height:32px; flex-shrink:0; }

  .add-item-row{ display:flex; gap:6px; align-items:center; margin-top:10px; }
  .add-item-row input[type=text]{ flex:1.4; }
  .add-item-row input[type=number]{ flex:1; }
  .add-item-row .icon-btn{ width:36px; height:36px; flex-shrink:0; background:var(--teal); color:#fff; border-color:var(--teal-deep); }

  .hint{ font-size:11.5px; color:var(--ink-soft); margin:6px 0 0; line-height:1.5; }

  /* ---------- Bottom tab bar ---------- */
  .tabbar{
    position:sticky; bottom:0; z-index:20;
    display:flex; background:var(--paper-raised); border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .tab-btn{
    flex:1; background:none; border:none; padding:12px 0 10px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:5px;
    color:var(--ink-soft); font-family:'Inter', sans-serif; font-size:11.5px; font-weight:600;
    letter-spacing:0.03em;
  }
  .punch{ width:6px; height:6px; border-radius:50%; background:transparent; border:1.4px solid var(--ink-soft); }
  .tab-btn.active{ color:var(--teal-deep); }
  .tab-btn.active .punch{ background:var(--teal); border-color:var(--teal); }

  /* ---------- Toast ---------- */
  #toast{
    position:fixed; left:50%; bottom:78px; transform:translate(-50%, 14px);
    background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:8px;
    font-size:13px; opacity:0; pointer-events:none; transition: opacity .25s ease, transform .25s ease;
    z-index:50; max-width:88%; text-align:center;
  }
  #toast.show{ opacity:1; transform:translate(-50%, 0); }

  #file-input{ display:none; }

  ::selection{ background: var(--teal); color:#fff; }
</style>
</head>
<body>
<div id="app">

  <div class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <button class="board-switcher" id="board-switcher" aria-haspopup="true" aria-expanded="false">
          <span class="board-name" id="board-name-label">Monthly</span>
          <svg class="board-chevron" id="board-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="month" id="month-label"></div>

        <div class="board-menu" id="board-menu">
          <div id="board-menu-list"></div>
          <button class="board-menu-add" id="board-menu-add">+ New budget</button>
          <p class="board-menu-hint" id="board-menu-hint"></p>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="btn-download" title="Download backup" aria-label="Download backup">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
        </button>
        <button class="icon-btn" id="btn-upload" title="Upload backup" aria-label="Upload backup">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9"/><path d="m7 14 5-5 5 5"/><path d="M5 3h14"/></svg>
        </button>
        <input type="file" id="file-input" accept="application/json">
      </div>
    </div>
  </div>

  <main class="view" id="view-overview"></main>
  <main class="view hidden" id="view-edit"></main>

  <nav class="tabbar">
    <button class="tab-btn active" data-tab="overview"><span class="punch"></span>Overview</button>
    <button class="tab-btn" data-tab="edit"><span class="punch"></span>Edit</button>
  </nav>

  <div id="toast"></div>
</div>

<script>
(function(){
  "use strict";

  var MAX_BOARDS = 4;
  var STORAGE_KEY = "ledger-data-v3";
  var LEGACY_KEY = "ledger-data-v2";

  var appState = { activeBoardId: null, boards: [] };
  var openCategoryIds = {};
  var currentTab = "overview";
  var boardMenuOpen = false;

  var $overview = document.getElementById("view-overview");
  var $edit = document.getElementById("view-edit");
  var $toast = document.getElementById("toast");
  var $boardSwitcher = document.getElementById("board-switcher");
  var $boardMenu = document.getElementById("board-menu");
  var $boardMenuList = document.getElementById("board-menu-list");
  var $boardMenuAdd = document.getElementById("board-menu-add");
  var $boardMenuHint = document.getElementById("board-menu-hint");
  var $boardChevron = document.getElementById("board-chevron");
  var $boardNameLabel = document.getElementById("board-name-label");

  var CHECK_SVG = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
  var X_SVG = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>';
  var TRASH_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>';
  var PLUS_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>';

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

  function fmt(n){
    n = Number(n) || 0;
    var neg = n < 0;
    var v = Math.abs(n).toLocaleString('en-GB', {minimumFractionDigits:2, maximumFractionDigits:2});
    return (neg ? "-£" : "£") + v;
  }

  function clampNum(v){
    var n = parseFloat(v);
    return isNaN(n) ? 0 : n;
  }

  function toast(msg){
    $toast.textContent = msg;
    $toast.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ $toast.classList.remove("show"); }, 1600);
  }

  function escapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  /* ---------- Board helpers ---------- */
  function cb(){
    return appState.boards.find(function(b){ return b.id === appState.activeBoardId; }) || appState.boards[0];
  }
  function createBoard(name){
    return { id: uid(), name: name, income: 0, categories: [] };
  }
  function normalizeCategory(c){
    c.id = c.id || uid();
    c.budget = Number(c.budget) || 0;
    c.budgetOverride = !!c.budgetOverride;
    c.planned = Array.isArray(c.planned) ? c.planned : (Array.isArray(c.items) ? c.items : []);
    c.planned.forEach(function(i){ i.id = i.id || uid(); i.amount = Number(i.amount)||0; i.paid = !!i.paid; });
    c.logs = Array.isArray(c.logs) ? c.logs : [];
    c.logs.forEach(function(i){ i.id = i.id || uid(); i.amount = Number(i.amount)||0; });
    return c;
  }
  function normalizeBoard(b){
    b.id = b.id || uid();
    b.name = (b.name && String(b.name).trim()) || "Budget";
    b.income = Number(b.income) || 0;
    b.categories = Array.isArray(b.categories) ? b.categories.map(normalizeCategory) : [];
    return b;
  }

  /* ---------- Derived numbers ---------- */
  function autoBudget(cat){
    return (cat.planned || []).reduce(function(s,i){ return s + (Number(i.amount)||0); }, 0);
  }
  function plannedSpent(cat){
    return (cat.planned || []).reduce(function(s,i){ return s + (i.paid ? (Number(i.amount)||0) : 0); }, 0);
  }
  function logsSpent(cat){
    return (cat.logs || []).reduce(function(s,i){ return s + (Number(i.amount)||0); }, 0);
  }
  function catSpent(cat){ return plannedSpent(cat) + logsSpent(cat); }
  function totalBudget(){ return cb().categories.reduce(function(s,c){ return s + (Number(c.budget)||0); }, 0); }
  function totalSpent(){ return cb().categories.reduce(function(s,c){ return s + catSpent(c); }, 0); }

  async function persist(silent){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      if(!silent) toast("Saved ✓");
    }catch(err){
      console.error("Save failed", err);
      toast("Couldn't save — try Download to back up manually");
    }
  }

  async function load(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        if(parsed && Array.isArray(parsed.boards) && parsed.boards.length){
          appState.boards = parsed.boards.map(normalizeBoard);
          appState.activeBoardId = parsed.activeBoardId && appState.boards.some(function(b){return b.id===parsed.activeBoardId;})
            ? parsed.activeBoardId : appState.boards[0].id;
        } else {
          throw new Error("empty");
        }
      } else {
        var legacyRaw = localStorage.getItem(LEGACY_KEY);
        if(legacyRaw){
          var legacy = JSON.parse(legacyRaw);
          var board = normalizeBoard({ name: "Monthly", income: legacy.income, categories: legacy.categories });
          appState.boards = [board];
          appState.activeBoardId = board.id;
          await persist(true);
        } else {
          seedSampleData();
          await persist(true);
        }
      }
    }catch(err){
      seedSampleData();
    }
    renderAll();
  }

  function seedSampleData(){
    var monthly = createBoard("Monthly");
    monthly.income = 3000;
    monthly.categories = [
      { id: uid(), name: "Groceries", budget: 200, budgetOverride: true,
        planned: [],
        logs: [ { id: uid(), name: "Sainsbury's", amount: 46 } ] },
      { id: uid(), name: "Subscriptions", budget: 12.99, budgetOverride: false,
        planned: [ { id: uid(), name: "Spotify", amount: 12.99, paid: true } ],
        logs: [] },
      { id: uid(), name: "Bills", budget: 900, budgetOverride: false,
        planned: [
          { id: uid(), name: "Rent", amount: 750, paid: false },
          { id: uid(), name: "Electricity", amount: 150, paid: false }
        ],
        logs: [] }
    ];
    appState.boards = [monthly];
    appState.activeBoardId = monthly.id;
  }

  function monthLabel(){
    return new Date().toLocaleDateString('en-GB', { month: 'long', year: 'numeric' }).toUpperCase();
  }
  document.getElementById("month-label").textContent = monthLabel();

  /* ---------------- Board switcher ---------------- */

  function renderBoardSwitcher(){
    $boardNameLabel.textContent = cb().name;

    var html = "";
    appState.boards.forEach(function(b){
      var active = b.id === appState.activeBoardId;
      html += '<div class="board-menu-item ' + (active?"active":"") + '" data-action="switch-board" data-id="' + b.id + '">';
      html += '  <span class="bname">' + escapeHtml(b.name) + '</span>';
      html += '  <span class="dot"></span>';
      html += '</div>';
    });
    $boardMenuList.innerHTML = html;

    var atMax = appState.boards.length >= MAX_BOARDS;
    $boardMenuAdd.disabled = atMax;
    $boardMenuHint.textContent = atMax ? "You've reached the limit of " + MAX_BOARDS + " budgets" : appState.boards.length + " of " + MAX_BOARDS + " budgets";
  }

  function openBoardMenu(){
    boardMenuOpen = true;
    $boardMenu.classList.add("open");
    $boardChevron.classList.add("open");
    $boardSwitcher.setAttribute("aria-expanded", "true");
  }
  function closeBoardMenu(){
    boardMenuOpen = false;
    $boardMenu.classList.remove("open");
    $boardChevron.classList.remove("open");
    $boardSwitcher.setAttribute("aria-expanded", "false");
  }

  $boardSwitcher.addEventListener("click", function(e){
    e.stopPropagation();
    if(boardMenuOpen) closeBoardMenu(); else openBoardMenu();
  });

  $boardMenuList.addEventListener("click", function(e){
    var item = e.target.closest('[data-action="switch-board"]');
    if(!item) return;
    var id = item.getAttribute("data-id");
    if(id !== appState.activeBoardId){
      appState.activeBoardId = id;
      openCategoryIds = {};
      persist(true);
      toast("Switched to " + cb().name);
      renderAll();
    }
    closeBoardMenu();
  });

  $boardMenuAdd.addEventListener("click", function(e){
    e.stopPropagation();
    if(appState.boards.length >= MAX_BOARDS) return;
    var name = window.prompt("Name this budget (e.g. Travel, House move)", "New Budget");
    if(name === null) return;
    name = name.trim();
    if(!name) name = "New Budget";
    var board = createBoard(name);
    appState.boards.push(board);
    appState.activeBoardId = board.id;
    openCategoryIds = {};
    persist(true);
    toast('"' + name + '" created ✓');
    closeBoardMenu();
    renderAll();
  });

  document.addEventListener("click", function(e){
    if(boardMenuOpen && !e.target.closest(".brand")){
      closeBoardMenu();
    }
  });

  /* ---------------- OVERVIEW ---------------- */

  function renderOverview(){
    var board = cb();
    var income = board.income || 0;
    var spent = totalSpent();
    var remaining = income - spent;
    var pct = income > 0 ? Math.min(100, (spent/income)*100) : (spent > 0 ? 100 : 0);
    var over = spent > income;

    var html = "";
    html += '<div class="hero">';
    html += '  <div class="hero-title">This month</div>';
    html += '  <div class="hero-remaining-label">Remaining</div>';
    html += '  <div class="hero-remaining-value ' + (remaining<0?"warn":"good") + '">' + fmt(remaining) + '</div>';
    html += '  <div class="hero-caption"><span class="num">' + fmt(spent) + '</span> spent of <span class="num">' + fmt(income) + '</span> income</div>';
    html += '  <div class="bar-track"><div class="bar-fill ' + (over?"over":"") + '" style="width:' + pct + '%"></div></div>';
    html += '</div>';

    html += '<div class="section-label">Categories</div>';

    if(board.categories.length === 0){
      html += '<div class="empty-state">';
      html += '  <h3>No categories yet</h3>';
      html += '  <p>Add a budget category — like Groceries or Bills — from the Edit tab to start tracking.</p>';
      html += '  <button class="btn" id="empty-go-edit">Add a category</button>';
      html += '</div>';
    } else {
      board.categories.forEach(function(cat){
        var cSpent = catSpent(cat);
        var cBudget = Number(cat.budget) || 0;
        var cRemaining = cBudget - cSpent;
        var cPct = cBudget > 0 ? Math.min(100, (cSpent/cBudget)*100) : (cSpent>0?100:0);
        var cOver = cSpent > cBudget && cBudget > 0;
        var isOpen = !!openCategoryIds[cat.id];

        html += '<div class="cat-card">';
        html += '  <div class="cat-head" data-action="toggle-cat" data-id="' + cat.id + '">';
        html += '    <div class="cat-head-left">';
        html += '      <div class="cat-name">' + escapeHtml(cat.name) + '</div>';
        html += '      <div class="cat-sub num">' + fmt(cSpent) + ' of ' + fmt(cBudget) + '</div>';
        html += '    </div>';
        html += '    <div class="cat-amounts">';
        html += '      <div class="remaining num ' + (cRemaining<0?"warn":"good") + '">' + fmt(cRemaining) + '</div>';
        html += '      <div class="of">remaining</div>';
        html += '    </div>';
        html += '    <div class="chev ' + (isOpen?"open":"") + '"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></div>';
        html += '  </div>';
        html += '  <div class="cat-bar-wrap"><div class="bar-track"><div class="bar-fill ' + (cOver?"over":"") + '" style="width:' + cPct + '%"></div></div></div>';

        html += '  <div class="cat-items ' + (isOpen?"open":"") + '">';

        if(cat.planned && cat.planned.length){
          html += '<div class="subsection-label">To pay — tap to mark paid</div>';
          cat.planned.forEach(function(it){
            html += '<div class="plan-row ' + (it.paid?"paid":"") + '" data-action="toggle-paid" data-cat="' + cat.id + '" data-id="' + it.id + '">';
            html += '  <span class="check ' + (it.paid?"checked":"") + '">' + (it.paid?CHECK_SVG:'') + '</span>';
            html += '  <span class="label">' + escapeHtml(it.name) + '</span>';
            html += '  <span class="leader"></span>';
            html += '  <span class="amount num">' + fmt(it.amount) + '</span>';
            html += '</div>';
          });
        }

        html += '<div class="subsection-label">Logged spend</div>';
        if(cat.logs && cat.logs.length){
          cat.logs.forEach(function(lg){
            html += '<div class="log-row">';
            html += '  <span class="label">' + escapeHtml(lg.name) + '</span><span class="leader"></span>';
            html += '  <span class="amount num">' + fmt(lg.amount) + '</span>';
            html += '  <button class="icon-btn ghost tiny" data-action="delete-log" data-cat="' + cat.id + '" data-id="' + lg.id + '" title="Remove" aria-label="Remove">' + X_SVG + '</button>';
            html += '</div>';
          });
        } else {
          html += '<div class="empty-items">Nothing logged yet.</div>';
        }

        html += '  <div class="quick-add-row">';
        html += '    <input type="text" class="qa-name" data-cat="' + cat.id + '" placeholder="e.g. Sainsbury\'s">';
        html += '    <input type="number" step="0.01" inputmode="decimal" class="qa-amount" data-cat="' + cat.id + '" placeholder="0.00">';
        html += '    <button class="icon-btn" data-action="quick-add-log" data-cat="' + cat.id + '" title="Log spend" aria-label="Log spend">' + PLUS_SVG + '</button>';
        html += '  </div>';

        html += '  </div>'; // .cat-items
        html += '</div>'; // .cat-card
      });
    }

    $overview.innerHTML = html;

    var emptyBtn = document.getElementById("empty-go-edit");
    if(emptyBtn) emptyBtn.addEventListener("click", function(){ switchTab("edit"); });
  }

  $overview.addEventListener("click", function(e){
    var toggleCat = e.target.closest('[data-action="toggle-cat"]');
    if(toggleCat){
      var id = toggleCat.getAttribute("data-id");
      openCategoryIds[id] = !openCategoryIds[id];
      renderOverview();
      return;
    }

    var togglePaid = e.target.closest('[data-action="toggle-paid"]');
    if(togglePaid){
      var cId = togglePaid.getAttribute("data-cat");
      var iId = togglePaid.getAttribute("data-id");
      var cat = cb().categories.find(function(c){ return c.id === cId; });
      var item = cat && cat.planned.find(function(i){ return i.id === iId; });
      if(item){
        item.paid = !item.paid;
        persist(true);
        toast(item.paid ? "Marked as paid ✓" : "Marked as unpaid");
        renderOverview();
      }
      return;
    }

    var delLog = e.target.closest('[data-action="delete-log"]');
    if(delLog){
      var cId2 = delLog.getAttribute("data-cat");
      var lId = delLog.getAttribute("data-id");
      var cat2 = cb().categories.find(function(c){ return c.id === cId2; });
      if(cat2){
        cat2.logs = cat2.logs.filter(function(l){ return l.id !== lId; });
        persist(true);
        toast("Removed");
        renderOverview();
      }
      return;
    }

    var quickAdd = e.target.closest('[data-action="quick-add-log"]');
    if(quickAdd){
      var cId3 = quickAdd.getAttribute("data-cat");
      var nameEl = $overview.querySelector('.qa-name[data-cat="' + cId3 + '"]');
      var amtEl = $overview.querySelector('.qa-amount[data-cat="' + cId3 + '"]');
      var name = nameEl.value.trim();
      var amount = clampNum(amtEl.value);
      if(!name){ toast("Add a short description first"); nameEl.focus(); return; }
      if(amount <= 0){ toast("Enter an amount"); amtEl.focus(); return; }
      var cat3 = cb().categories.find(function(c){ return c.id === cId3; });
      if(cat3){
        cat3.logs = cat3.logs || [];
        cat3.logs.push({ id: uid(), name: name, amount: amount });
        persist(true);
        toast("Logged " + fmt(amount) + " ✓");
        renderOverview();
      }
      return;
    }
  });

  /* ---------------- EDIT ---------------- */

  function renderEdit(){
    var board = cb();
    var html = "";

    html += '<div class="section-label">This budget</div>';
    html += '<div class="edit-card">';
    html += '  <label class="flabel">Budget name</label>';
    html += '  <div class="row-inline">';
    html += '    <div><input type="text" id="board-name-input" value="' + escapeHtml(board.name) + '"></div>';
    html += '    <button class="btn small" id="save-board-name">Save</button>';
    html += '  </div>';
    if(appState.boards.length > 1){
      html += '  <button class="btn danger small" style="margin-top:10px;" id="delete-board">Delete this budget</button>';
    } else {
      html += '  <p class="hint">You need at least one budget — add another before deleting this one.</p>';
    }
    html += '</div>';

    html += '<div class="edit-card">';
    html += '  <label class="flabel">Monthly income</label>';
    html += '  <div class="row-inline">';
    html += '    <div><input type="number" step="0.01" inputmode="decimal" id="income-input" value="' + (board.income || 0) + '"></div>';
    html += '    <button class="btn" id="save-income">Save</button>';
    html += '  </div>';
    html += '</div>';

    html += '<div class="section-label">Add a category</div>';
    html += '<div class="edit-card">';
    html += '  <div class="field-group"><label class="flabel">Category name</label><input type="text" id="new-cat-name" placeholder="e.g. Groceries"></div>';
    html += '  <div class="field-group"><label class="flabel">Starting budget (optional)</label><input type="number" step="0.01" inputmode="decimal" id="new-cat-budget" placeholder="0.00"></div>';
    html += '  <p class="hint" style="margin-bottom:10px;">Leave this at 0 if you\'d rather add sub-expenses below and let the budget total itself.</p>';
    html += '  <button class="btn block" id="add-category">+ Add category</button>';
    html += '</div>';

    html += '<div class="section-label">Categories in ' + escapeHtml(board.name) + '</div>';

    if(board.categories.length === 0){
      html += '<p class="hint">Nothing yet — add your first category above, then set up sub-expenses under it.</p>';
    }

    board.categories.forEach(function(cat){
      var auto = autoBudget(cat);
      html += '<div class="edit-card" data-cat-card="' + cat.id + '">';
      html += '  <div class="edit-card-head">';
      html += '    <div class="cat-name">' + escapeHtml(cat.name) + '</div>';
      html += '    <button class="icon-btn ghost" data-action="delete-cat" data-id="' + cat.id + '" title="Delete category" aria-label="Delete category">' + TRASH_SVG + '</button>';
      html += '  </div>';

      html += '  <label class="flabel">Budget' + (cat.budgetOverride ? '<span class="override-tag"> · OVERRIDDEN</span>' : '') + '</label>';
      html += '  <div class="row-inline">';
      html += '    <div><input type="number" step="0.01" inputmode="decimal" class="cat-budget-input" data-id="' + cat.id + '" value="' + (cat.budget || 0) + '"></div>';
      html += '    <button class="btn small" data-action="save-budget" data-id="' + cat.id + '">Save</button>';
      html += '  </div>';
      if(cat.budgetOverride){
        html += '  <button class="btn secondary small" style="margin-top:8px;" data-action="reset-budget" data-id="' + cat.id + '">Reset to auto (' + fmt(auto) + ')</button>';
      } else {
        html += '  <p class="hint">Auto-set to the sum of sub-expenses below.</p>';
      }

      html += '  <div class="items-list">';
      html += '    <label class="flabel">Sub-expenses</label>';
      if(!cat.planned || cat.planned.length === 0){
        html += '<p class="hint" style="margin-top:0;">None yet. These show as a paid/unpaid checklist on the Overview page — for things like recurring bills or subscriptions.</p>';
      }
      (cat.planned||[]).forEach(function(it){
        html += '<div class="item-edit-row" data-item-row="' + it.id + '">';
        html += '  <input type="text" class="item-name-input" data-cat="' + cat.id + '" data-id="' + it.id + '" value="' + escapeHtml(it.name) + '" placeholder="Item">';
        html += '  <input type="number" step="0.01" inputmode="decimal" class="item-amount-input" data-cat="' + cat.id + '" data-id="' + it.id + '" value="' + (it.amount||0) + '">';
        html += '  <button class="icon-btn" data-action="save-item" data-cat="' + cat.id + '" data-id="' + it.id + '" title="Save item" aria-label="Save item">' + CHECK_SVG + '</button>';
        html += '  <button class="icon-btn" data-action="delete-item" data-cat="' + cat.id + '" data-id="' + it.id + '" title="Delete item" aria-label="Delete item">' + X_SVG + '</button>';
        html += '</div>';
      });
      html += '  </div>';

      html += '  <div class="add-item-row">';
      html += '    <input type="text" class="new-item-name" data-cat="' + cat.id + '" placeholder="e.g. Spotify">';
      html += '    <input type="number" step="0.01" inputmode="decimal" class="new-item-amount" data-cat="' + cat.id + '" placeholder="0.00">';
      html += '    <button class="icon-btn" data-action="add-item" data-cat="' + cat.id + '" title="Add sub-expense" aria-label="Add sub-expense">' + PLUS_SVG + '</button>';
      html += '  </div>';

      html += '</div>';
    });

    $edit.innerHTML = html;

    document.getElementById("save-board-name").addEventListener("click", function(){
      var nameEl = document.getElementById("board-name-input");
      var val = nameEl.value.trim();
      if(!val){ toast("Give this budget a name"); nameEl.focus(); return; }
      cb().name = val;
      flashSaved(this);
      persist(true);
      renderBoardSwitcher();
      renderEdit();
    });

    var deleteBoardBtn = document.getElementById("delete-board");
    if(deleteBoardBtn){
      deleteBoardBtn.addEventListener("click", function(){
        if(appState.boards.length <= 1) return;
        if(confirm('Delete "' + cb().name + '" and everything in it? This can\'t be undone.')){
          var idx = appState.boards.findIndex(function(b){ return b.id === appState.activeBoardId; });
          appState.boards.splice(idx, 1);
          appState.activeBoardId = appState.boards[0].id;
          openCategoryIds = {};
          persist(true);
          toast("Budget deleted");
          renderAll();
        }
      });
    }

    document.getElementById("save-income").addEventListener("click", function(){
      var val = clampNum(document.getElementById("income-input").value);
      cb().income = val;
      flashSaved(this);
      persist();
      renderOverview();
    });

    document.getElementById("add-category").addEventListener("click", function(){
      var nameEl = document.getElementById("new-cat-name");
      var budgetEl = document.getElementById("new-cat-budget");
      var name = nameEl.value.trim();
      if(!name){ toast("Give the category a name first"); nameEl.focus(); return; }
      var budget = clampNum(budgetEl.value);
      cb().categories.push({
        id: uid(), name: name, budget: budget, budgetOverride: budget !== 0,
        planned: [], logs: []
      });
      persist(true);
      toast("Category added ✓");
      renderEdit();
      renderOverview();
    });
  }

  function flashSaved(btn){
    var original = btn.textContent;
    btn.classList.add("saved");
    btn.textContent = "Saved ✓";
    setTimeout(function(){
      btn.classList.remove("saved");
      btn.textContent = original;
    }, 1100);
  }

  function recalcAutoBudget(cat){
    if(!cat.budgetOverride){
      cat.budget = autoBudget(cat);
    }
  }

  $edit.addEventListener("click", function(e){
    var btn = e.target.closest("[data-action]");
    if(!btn) return;
    var action = btn.getAttribute("data-action");

    if(action === "save-budget"){
      var id = btn.getAttribute("data-id");
      var input = $edit.querySelector('.cat-budget-input[data-id="' + id + '"]');
      var cat = cb().categories.find(function(c){ return c.id === id; });
      if(cat && input){
        var newVal = clampNum(input.value);
        var auto = autoBudget(cat);
        if(Math.abs(newVal - auto) < 0.005){
          cat.budgetOverride = false;
          cat.budget = auto;
        } else {
          cat.budgetOverride = true;
          cat.budget = newVal;
        }
        flashSaved(btn);
        persist(true);
        toast("Budget saved ✓");
        renderOverview();
        renderEdit();
      }
    }

    if(action === "reset-budget"){
      var idR = btn.getAttribute("data-id");
      var catR = cb().categories.find(function(c){ return c.id === idR; });
      if(catR){
        catR.budgetOverride = false;
        catR.budget = autoBudget(catR);
        persist(true);
        toast("Budget reset to auto ✓");
        renderOverview();
        renderEdit();
      }
    }

    if(action === "delete-cat"){
      var id2 = btn.getAttribute("data-id");
      if(confirm("Delete this category and everything in it?")){
        cb().categories = cb().categories.filter(function(c){ return c.id !== id2; });
        persist(true);
        toast("Category deleted");
        renderEdit();
        renderOverview();
      }
    }

    if(action === "add-item"){
      var cId = btn.getAttribute("data-cat");
      var nameInput = $edit.querySelector('.new-item-name[data-cat="' + cId + '"]');
      var amtInput = $edit.querySelector('.new-item-amount[data-cat="' + cId + '"]');
      var name = nameInput.value.trim();
      if(!name){ toast("Give the item a name first"); nameInput.focus(); return; }
      var amount = clampNum(amtInput.value);
      var cat = cb().categories.find(function(c){ return c.id === cId; });
      if(cat){
        cat.planned = cat.planned || [];
        cat.planned.push({ id: uid(), name: name, amount: amount, paid: false });
        recalcAutoBudget(cat);
        persist(true);
        toast("Sub-expense added ✓");
        renderEdit();
        renderOverview();
      }
    }

    if(action === "save-item"){
      var cId2 = btn.getAttribute("data-cat");
      var iId = btn.getAttribute("data-id");
      var nameEl = $edit.querySelector('.item-name-input[data-id="' + iId + '"]');
      var amtEl = $edit.querySelector('.item-amount-input[data-id="' + iId + '"]');
      var cat2 = cb().categories.find(function(c){ return c.id === cId2; });
      var item = cat2 && cat2.planned.find(function(i){ return i.id === iId; });
      if(item){
        item.name = nameEl.value.trim() || item.name;
        item.amount = clampNum(amtEl.value);
        recalcAutoBudget(cat2);
        persist(true);
        toast("Saved ✓");
        renderOverview();
        renderEdit();
      }
    }

    if(action === "delete-item"){
      var cId3 = btn.getAttribute("data-cat");
      var iId2 = btn.getAttribute("data-id");
      var cat3 = cb().categories.find(function(c){ return c.id === cId3; });
      if(cat3){
        cat3.planned = cat3.planned.filter(function(i){ return i.id !== iId2; });
        recalcAutoBudget(cat3);
        persist(true);
        toast("Item deleted");
        renderEdit();
        renderOverview();
      }
    }
  });

  /* ---------------- Tabs ---------------- */

  function switchTab(tab){
    currentTab = tab;
    document.querySelectorAll(".tab-btn").forEach(function(b){
      b.classList.toggle("active", b.getAttribute("data-tab") === tab);
    });
    $overview.classList.toggle("hidden", tab !== "overview");
    $edit.classList.toggle("hidden", tab !== "edit");
    if(tab === "overview") renderOverview();
    if(tab === "edit") renderEdit();
    window.scrollTo(0,0);
  }

  document.querySelectorAll(".tab-btn").forEach(function(b){
    b.addEventListener("click", function(){ switchTab(b.getAttribute("data-tab")); });
  });

  /* ---------------- Download / Upload ---------------- */

  document.getElementById("btn-download").addEventListener("click", function(){
    var payload = JSON.stringify({ boards: appState.boards, activeBoardId: appState.activeBoardId, exportedAt: new Date().toISOString() }, null, 2);
    var blob = new Blob([payload], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    var stamp = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = "ledger-backup-" + stamp + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast("Backup downloaded ✓");
  });

  var fileInput = document.getElementById("file-input");
  document.getElementById("btn-upload").addEventListener("click", function(){
    fileInput.value = "";
    fileInput.click();
  });
  fileInput.addEventListener("change", function(){
    var file = fileInput.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var parsed = JSON.parse(reader.result);
        var boards;
        if(Array.isArray(parsed.boards) && parsed.boards.length){
          boards = parsed.boards.map(normalizeBoard);
        } else if(typeof parsed.income === "number" && Array.isArray(parsed.categories)){
          // legacy single-board backup
          boards = [ normalizeBoard({ name: "Monthly", income: parsed.income, categories: parsed.categories }) ];
        } else {
          throw new Error("bad shape");
        }
        appState.boards = boards;
        appState.activeBoardId = (parsed.activeBoardId && boards.some(function(b){return b.id===parsed.activeBoardId;}))
          ? parsed.activeBoardId : boards[0].id;
        openCategoryIds = {};
        persist(true);
        toast("Backup imported ✓");
        renderAll();
      }catch(err){
        toast("That file doesn't look like a valid backup");
      }
    };
    reader.readAsText(file);
  });

  function renderAll(){
    renderBoardSwitcher();
    renderOverview();
    renderEdit();
  }

  load();
})();
</script>
</body>
</html>
